<!DOCTYPE html>
<html lang="en" ng-app="campusConnectApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusConnect AI | Smart College Information & Guidance Portal</title>
  <meta name="description" content="Intelligent college counselling, historical cutoff predictions, fee calculators, campus life exploration and student assistant powered by AngularJS and Node/Express/MongoDB.">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- FontAwesome 6 Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="app/assets/css/style.css">
</head>
<body>

  <!-- Main App Shell -->
  <div class="app-wrapper">

    <!-- Global Toast Notifications Container (AngularJS ng-repeat) -->
    <div class="toast-portal-container" ng-if="$root.toasts && $root.toasts.length > 0">
      <div class="portal-toast" ng-repeat="toast in $root.toasts track by toast.id" ng-class="toast.type">
        <div class="d-flex align-items-center gap-2">
          <i class="fa-solid" ng-class="{
            'fa-circle-check': toast.type === 'success',
            'fa-triangle-exclamation': toast.type === 'error' || toast.type === 'warning',
            'fa-circle-info': toast.type === 'info'
          }"></i>
          <span class="small fw-semibold">{{toast.message}}</span>
        </div>
        <button type="button" class="btn btn-sm btn-link text-white p-0 ms-3" ng-click="$root.removeToast($index)">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <!-- Sidebar Component Included via AngularJS ng-include -->
    <div ng-include="'app/components/sidebar/sidebar.html'"></div>

    <!-- Main Viewport Content Area -->
    <main class="main-content">
      <!-- Navbar Component Included via AngularJS ng-include -->
      <div ng-include="'app/components/navbar/navbar.html'"></div>

      <!-- Single Page Application Dynamic View Host (ng-view) -->
      <div ng-view class="view-content-wrapper animate-view"></div>
    </main>

    <!-- Floating AI Chatbot Custom Directive: <chatbot-widget> -->
    <chatbot-widget></chatbot-widget>

  </div>

  <!-- Third-Party Vendor Libraries -->
  <!-- Chart.js for Historical Cutoff Analytics Visualizations -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>

  <!-- Bootstrap 5 JavaScript Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- AngularJS 1.8.2 Core & Standard Extension Modules -->
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-animate.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-sanitize.min.js"></script>

  <!-- CampusConnect AI Application Scripts -->
  <!-- 1. Module Definition & Configuration -->
  <script src="app/app.js"></script>
  <script src="app/routes.js"></script>

  <!-- 2. Services ($http Rest Communication Layer) -->
  <script src="app/services/apiService.js"></script>
  <script src="app/services/authService.js"></script>
  <script src="app/services/departmentService.js"></script>
  <script src="app/services/cutoffService.js"></script>
  <script src="app/services/feesService.js"></script>
  <script src="app/services/hostelService.js"></script>
  <script src="app/services/transportService.js"></script>
  <script src="app/services/placementService.js"></script>
  <script src="app/services/chatbotService.js"></script>
  <script src="app/services/admissionService.js"></script>

  <!-- 3. Custom Directives (DDO Components) -->
  <script src="app/directives/collegeCardDirective.js"></script>
  <script src="app/directives/departmentCardDirective.js"></script>
  <script src="app/directives/cutoffBadgeDirective.js"></script>
  <script src="app/directives/loadingDirective.js"></script>
  <script src="app/directives/chatbotDirective.js"></script>
  <script src="app/directives/passwordStrengthDirective.js"></script>

  <!-- 4. Custom Filters (Data Presentation Formatters) -->
  <script src="app/filters/currencyFilter.js"></script>
  <script src="app/filters/cutoffFilter.js"></script>
  <script src="app/filters/departmentFilter.js"></script>
  <script src="app/filters/searchFilter.js"></script>
  <script src="app/filters/placementFilter.js"></script>

  <!-- 5. Controllers (Business & UI View Model Logic) -->
  <script src="app/controllers/authController.js"></script>
  <script src="app/controllers/dashboardController.js"></script>
  <script src="app/controllers/departmentController.js"></script>
  <script src="app/controllers/cutoffController.js"></script>
  <script src="app/controllers/feesController.js"></script>
  <script src="app/controllers/hostelController.js"></script>
  <script src="app/controllers/transportController.js"></script>
  <script src="app/controllers/placementController.js"></script>
  <script src="app/controllers/chatbotController.js"></script>
  <script src="app/controllers/admissionController.js"></script>
  <script src="app/controllers/profileController.js"></script>
  <script src="app/controllers/adminController.js"></script>

</body>
</html>
