<div class="card card-custom card-hover h-100 p-4 border-0 shadow-sm position-relative">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <span class="badge rounded-pill px-3 py-1 font-monospace" ng-class="company.tier | tierBadgeClass">
      {{company.tier}}
    </span>
    <span class="badge bg-light text-muted border border-light-subtle">
      <i class="fa-solid fa-calendar me-1"></i> {{company.hiringYear}}
    </span>
  </div>

  <h5 class="fw-bold text-dark mb-1">{{company.companyName}}</h5>
  <div class="text-primary small fw-semibold mb-3">{{company.industry}}</div>

  <div class="p-3 bg-light rounded-3 mb-3 border border-light-subtle">
    <div class="row g-2">
      <div class="col-7">
        <small class="text-muted d-block font-monospace">PACKAGE OFFERED</small>
        <div class="fw-bold text-success fs-6">{{company.package}}</div>
      </div>
      <div class="col-5 text-end">
        <small class="text-muted d-block font-monospace">SELECTIONS</small>
        <div class="fw-bold text-dark fs-6">{{company.offersCount}} Offers</div>
      </div>
    </div>
  </div>

  <div class="mb-3 flex-grow-1">
    <small class="text-muted d-block font-monospace mb-1">JOB DESIGNATION</small>
    <div class="small fw-semibold text-dark">{{company.jobRole}}</div>
  </div>

  <div class="mb-3">
    <small class="text-muted d-block font-monospace mb-1">ELIGIBLE BRANCHES</small>
    <div class="d-flex flex-wrap gap-1">
      <span class="badge bg-light text-dark border border-light-subtle" ng-repeat="dept in company.department">
        {{dept}}
      </span>
    </div>
  </div>

  <div class="pt-2 border-top border-light d-flex align-items-center justify-content-between">
    <a ng-href="{{company.website}}" target="_blank" rel="noopener noreferrer" class="btn btn-outline-secondary btn-sm rounded-pill">
      Company Portal <i class="fa-solid fa-arrow-up-right-from-square ms-1"></i>
    </a>
  </div>
</div>
