<!-- CAMPUSCONNECT AI - Top Navbar Component -->
<header class="app-topbar" ng-controller="AuthController as auth">
  <div class="d-flex align-items-center gap-3">
    <!-- Mobile sidebar toggler button -->
    <button class="btn btn-light d-lg-none p-2 border" type="button" onclick="document.querySelector('.app-sidebar').classList.toggle('show-mobile')">
      <i class="fa-solid fa-bars"></i>
    </button>

    <div>
      <h5 class="fw-bold mb-0 text-dark font-sans d-flex align-items-center gap-2">
        <i class="fa-solid fa-graduation-cap text-primary"></i>
        <span>CampusConnect AI Portal</span>
      </h5>
      <small class="text-muted d-none d-sm-inline">Smart College Information, Admission Guidance & Student Assistance</small>
    </div>
  </div>

  <div class="d-flex align-items-center gap-3">
    <!-- Quick AI Floating Launcher toggle button in topbar -->
    <button type="button" class="btn btn-outline-primary btn-sm rounded-pill d-flex align-items-center gap-2 fw-semibold" ng-click="toggleChatbot()">
      <i class="fa-solid fa-sparkles text-info"></i>
      <span class="d-none d-md-inline">Ask AI</span>
    </button>

    <!-- User Authentication State in Navbar -->
    <div ng-if="auth.currentUser" class="dropdown">
      <button class="btn btn-light btn-sm rounded-pill border d-flex align-items-center gap-2 px-3 py-1 shadow-none" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center fw-bold" style="width: 26px; height: 26px; font-size: 0.8rem;">
          {{auth.currentUser.name.charAt(0).toUpperCase()}}
        </div>
        <span class="fw-semibold small d-none d-sm-inline">{{auth.currentUser.name}}</span>
        <i class="fa-solid fa-chevron-down text-muted" style="font-size: 0.75rem;"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow-sm border-light-subtle rounded-3 py-2">
        <li class="px-3 py-1">
          <small class="text-muted d-block font-monospace">SIGNED IN AS</small>
          <div class="fw-bold small">{{auth.currentUser.email}}</div>
          <span class="badge bg-primary-subtle text-primary mt-1">{{auth.currentUser.role}}</span>
        </li>
        <li><hr class="dropdown-divider"></li>
        <li>
          <a class="dropdown-item small" href="#/profile">
            <i class="fa-solid fa-id-card me-2 text-primary"></i> Student Profile
          </a>
        </li>
        <li ng-if="auth.currentUser.role === 'Admin'">
          <a class="dropdown-item small text-danger" href="#/admin">
            <i class="fa-solid fa-shield-halved me-2"></i> Admin Panel
          </a>
        </li>
        <li><hr class="dropdown-divider"></li>
        <li>
          <button class="dropdown-item small text-danger" type="button" ng-click="auth.logout()">
            <i class="fa-solid fa-right-from-bracket me-2"></i> Sign Out
          </button>
        </li>
      </ul>
    </div>

    <!-- Login & Register buttons if not logged in -->
    <div ng-if="!auth.currentUser" class="d-flex align-items-center gap-2">
      <a href="#/login" class="btn btn-outline-primary btn-sm rounded-pill px-3">
        Sign In
      </a>
      <a href="#/register" class="btn btn-primary btn-sm rounded-pill px-3">
        Register
      </a>
    </div>
  </div>
</header>
